# GitHub Actions build matrix.
#
# Targets:
#   - totem_left          : the central half (paired to host over USB/BT)
#   - totem_right         : the peripheral half (talks to the left half)
#   - totem_left_studio   : Studio-enabled central with raw HID + keypeek
#                           support. Replaces totem_left when you want live
#                           keymap edits in ZMK Studio and/or the keypeek
#                           on-screen overlay.
#   - settings_reset      : flash to wipe stored settings on either half.

include:
  - board: seeeduino_xiao_ble
    shield: totem_left

  - board: seeeduino_xiao_ble
    shield: totem_right

  - board: seeeduino_xiao_ble
    shield: totem_left raw_hid_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: totem_left_studio

  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: settings_reset
