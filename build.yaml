# GitHub Actions build matrix (no-studio branch).
#
# Targets:
#   - totem_left          : the central half (paired to host over USB/BT)
#   - totem_right         : the peripheral half (talks to the left half)
#   - totem_left_keypeek  : central with raw HID + keypeek layer notifier
#                           for the srwi/keypeek on-screen overlay.
#                           Flash this instead of totem_left if you want keypeek.
#   - settings_reset      : flash to wipe stored settings on either half.

include:
  - board: xiao_ble/nrf52840/zmk
    shield: totem_left

  - board: xiao_ble/nrf52840/zmk
    shield: totem_right

  - board: xiao_ble/nrf52840/zmk
    shield: totem_left raw_hid_adapter
    artifact-name: totem_left_keypeek

  - board: xiao_ble/nrf52840/zmk
    shield: settings_reset
    artifact-name: settings_reset
