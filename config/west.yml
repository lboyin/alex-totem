# west manifest — declares the modules pulled in at build time.
#
# Notes:
# - We pin ZMK to v0.3 (the last release before the Dec 2025 Zephyr 4.1
#   migration). The 4.1 migration broke deep-sleep wake on the central
#   half — see zmkfirmware/zmk#3207 and #3195. Until those are fixed
#   upstream, v0.3 is the recommended stable.
# - urob/zmk-helpers provides the nodefree macros (ZMK_BEHAVIOR, ZMK_LAYER,
#   ZMK_COMBO) used in config/totem.keymap. We do NOT use its totem.h key
#   labels — those assume the bsag-style interleaved matrix; we define our
#   own labels inline for the row-major matrix.
# - zzeneg/zmk-raw-hid + srwi/zmk-keypeek-layer-notifier expose key-position
#   and layer events over USB Raw HID so srwi/keypeek can render the active
#   layer on the host. Only used when building the studio firmware that
#   pulls in the `raw_hid_adapter` shield (see build.yaml).

manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
    - name: zzeneg
      url-base: https://github.com/zzeneg
    - name: srwi
      url-base: https://github.com/srwi
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
    - name: zmk-helpers
      remote: urob
      revision: v0.3.0
    - name: zmk-raw-hid
      remote: zzeneg
      revision: main
    - name: zmk-keypeek-layer-notifier
      remote: srwi
      revision: master
  self:
    path: config
