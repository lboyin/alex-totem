# ZMK user config for the TOTEM.
# This file is merged with boards/shields/totem/*.conf at build time.

# Combos: bsag's keymap uses lots of per-key combos; bump the limit.
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=8
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=4

# Sleep after idle. Increase if your battery life is fine.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Bluetooth: up to 4 paired hosts.
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4

# Disable USB serial logging (saves battery; flip to y for debugging).
CONFIG_ZMK_USB_LOGGING=n

# Uncomment if you flash an external RGB underglow:
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
